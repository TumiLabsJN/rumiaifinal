# Ultralytics ByteTrack configuration - Phase 1: Conservative improvements
# Based on Ultralytics YOLO tracker configuration format

tracker_type: bytetrack      # Tracker backend (bytetrack or botsort)
track_high_thresh: 0.25      # First-stage match threshold (standard for person detection)
track_low_thresh: 0.08       # Slightly more aggressive recovery (vs 0.1)
new_track_thresh: 0.8        # Much stricter new track creation (vs 0.6) - key change
track_buffer: 120            # Keep lost tracks for 120 frames (4 seconds vs 3 seconds)
match_thresh: 0.7            # Association similarity threshold (higher for stricter matching)
fuse_score: true             # Fuse detection score with motion/IoU for stability